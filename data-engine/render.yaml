services:
  - type: web
    name: f1-data-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.server
    envVars:
      # numpy/pandas/psycopg2-binary have no wheels for Render's 3.14 default:
      # unpinned, the build compiles them from source and OOMs the free tier.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      # The API's KV cache (apps/api/src/common/kv-cache.ts): bumped after every job that writes Neon.
      # Token scope: Account > Workers KV Storage > Edit, nothing else.
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CF_KV_NAMESPACE_ID
        sync: false
      # Neon budget watchdog: read from Neon's control-plane API, which never wakes the database.
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
