name = "f1-intelligence-web"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# This overrides any PUBLIC_API_URL set in the Pages dashboard (see docs/deployment.md). The API's
# custom domain from apps/api/wrangler.toml `routes`: only there does its edge cache work (ADR 0005).
PUBLIC_API_URL = "https://f1-api.gorkemkaryol.dev"
# Public URL of the share-image bucket (docs/deployment.md, "Share images"). Unset, pages keep /og-image.jpg.
# PUBLIC_OG_IMAGE_URL = "https://og.f1.gorkemkaryol.dev"

# Build-system vars: a valid Pages wrangler.toml overrides dashboard env vars,
# so these have to live here. Skip Cloudflare's npm auto-install (npm 10.9.2
# crashes resolving the vitest peer graph with no lockfile) and let the
# dashboard build command run `bun install --frozen-lockfile` instead.
SKIP_DEPENDENCY_INSTALL = "1"
BUN_VERSION = "1.4.0"
