name = "f1-prediction-platform-api"
main = "src/main.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# The edge cache (src/common/edge-cache.ts) only works on a custom domain, never on *.workers.dev.
# One level under the zone: Universal SSL doesn't cover deeper names like api.f1.gorkemkaryol.dev.
routes = [
  { pattern = "f1-api.gorkemkaryol.dev", custom_domain = true },
]
# Off: on *.workers.dev the edge cache is a no-op, so every request there could wake Neon.
# apps/web calls the custom domain (apps/web/wrangler.toml PUBLIC_API_URL).
workers_dev = false

# DATABASE_URL is set via the Cloudflare dashboard (Variables and Secrets)
# keep_vars = true prevents deploys from erasing dashboard-set variables
# Never put secrets in this file

[vars]
# Gates which CORS origins are allowed: see main.ts. Local dev overrides
# this to "development" via .dev.vars so localhost origins keep working.
ENVIRONMENT = "production"

# Cloudflare's Build watch path for this Worker was a bare "apps/api" for weeks,
# which never matched any nested file, so every push silently built zero times:
# only manual `wrangler deploy` ever actually shipped this Worker. Fixed on
# 2026-08-24 by changing the watch path to "apps/api/**" in the dashboard.
