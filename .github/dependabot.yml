version: 2
updates:
  # One weekly PR per ecosystem for minor/patch bumps; majors still come one by one.
  - package-ecosystem: bun
    directories: ["/apps/api", "/apps/web", "/apps/e2e"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /data-engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 3.9+ needs F1TV logins (ADR 0011); 3.5.3 only reads the schedule and the local backfill cache.
      - dependency-name: fastf1
      # Majors need wheels for Python 3.12 on Render Free, where a source build runs out of memory.
      - dependency-name: numpy
        update-types: [version-update:semver-major]
      - dependency-name: pandas
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
