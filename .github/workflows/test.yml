name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  data-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Local Postgres + Neon HTTP proxy (docker-compose.test.yml): CI never spends Neon Free CU-hours.
      - run: bun run test:db:up
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: apps/web
      - run: bun install
        working-directory: apps/e2e
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bun run test
        working-directory: apps/e2e
